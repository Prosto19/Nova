name: Publish NOVA
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test
        run: |
          node build-demo.mjs
          node --test tests/*.test.mjs
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build portable site
        env:
          NOVA_OUTPUT_DIR: dist
          NOVA_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node build-demo.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
